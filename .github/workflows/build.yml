name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VidScribe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VidScribe-apk
          path: VidScribe.apk
      - name: Publish as a release (direct phone download)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" VidScribe.apk \
            --title "VidScribe (build ${{ github.run_number }})" \
            --notes "Tap VidScribe.apk below to download and install." \
            --latest
